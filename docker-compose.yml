services:
  postgres:
    image: postgres:17-alpine
    container_name: accessevent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-accessevent}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-accessevent}
      POSTGRES_DB: ${DATABASE_NAME:-accessevent}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-accessevent} -d ${DATABASE_NAME:-accessevent}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accessevent-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-accessevent}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-accessevent}
      DATABASE_NAME: ${DATABASE_NAME:-accessevent}
      DATABASE_SCHEMA: public
      DATABASE_SSL: 'false'
      DATABASE_LOGGING: 'false'
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - '${PORT:-3333}:3333'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3333/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
